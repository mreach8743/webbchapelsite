name: Deploy to GitHub Pages

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages (peaceiris)
        uses: peaceiris/actions-gh-pages@v5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: './'
          publish_branch: gh-pages
          publish_commit_message: 'Deploy site from development branch via GitHub Actions'
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

# Optionally, if you want this to run in a dedicated deployment job,
# you can split the build and deploy steps. For static HTML only, this is enough.

